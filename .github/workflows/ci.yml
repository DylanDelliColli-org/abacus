name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup toolchain install "${{ steps.rust-version.outputs.version }}" --profile minimal
      - name: Install br
        run: |
          archive="$RUNNER_TEMP/br-0.3.2-linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" https://github.com/Dicklesworthstone/beads_rust/releases/download/v0.3.2/br-0.3.2-linux_amd64.tar.gz
          echo "e67c560e77e912490e44a65e3e9c13205210d171e729c5d801072ee508207288  $RUNNER_TEMP/br-0.3.2-linux_amd64.tar.gz" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" br
          install -m 0755 "$RUNNER_TEMP/br" "$HOME/.cargo/bin/br"
          br --version
      - name: Test
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-version.outputs.version }}
        run: |
          export BR_REAL="$HOME/.cargo/bin/br"
          cargo test

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust with Clippy
        run: rustup toolchain install "${{ steps.rust-version.outputs.version }}" --profile minimal --component clippy
      - name: Clippy
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-version.outputs.version }}
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Rust version
        id: rust-version
        run: |
          version="$(sed -n 's/^rust-version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust with rustfmt
        run: rustup toolchain install "${{ steps.rust-version.outputs.version }}" --profile minimal --component rustfmt
      - name: Format
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-version.outputs.version }}
        run: cargo fmt --check
